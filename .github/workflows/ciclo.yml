name: Ciclo de vigilancia - Monitor de Cruces

on:
  schedule:
    # Cada 15 minutos. Ajusta si cambias INTERVALO_MINUTOS conceptualmente
    # (aqui no aplica ese valor: quien manda es este cron, no el bucle interno).
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions" de GitHub

jobs:
  ejecutar-ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar un ciclo de vigilancia
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CANAL_TELEGRAM: ${{ vars.CANAL_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANAL_EMAIL: ${{ vars.CANAL_EMAIL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TV_SESSION: ${{ secrets.TV_SESSION }}
          TV_SIGNATURE: ${{ secrets.TV_SIGNATURE }}
          # INTERVALO_MINUTOS se deja vacio a proposito: en GitHub Actions el
          # ciclo debe ejecutarse UNA vez y salir; es el cron de arriba quien
          # decide la periodicidad.
        run: npm run ciclo
