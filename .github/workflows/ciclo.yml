name: Ciclo de vigilancia - Monitor de Cruces

on:
  schedule:

    # Cada 6 horas: con 496 activos y el codigo actual (sin optimizar todavia),
    # Cada 15 minutos. Ajusta si cambias INTERVALO_MINUTOS conceptualmente
    # (aqui no aplica ese valor: quien manda es este cron, no el bucle interno).
   # Cada 6 horas: con 496 activos y el codigo actual (sin optimizar todavia),
    # es la frecuencia mas alta que cabe en el limite gratuito de GitHub
    # (2000 min/mes). Cambia SOLO esta linea segun tu criterio - opciones ya
    # calculadas (comenta/descomenta la que quieras usar):
    #
    #   */30 * * * *   -> cada 30 min   (necesitas <= 46 activos)
    #   0 * * * *      -> cada 1 hora   (necesitas <= 93 activos)
    #   0 */2 * * *    -> cada 2 horas  (necesitas <= 187 activos)
    #   0 */4 * * *    -> cada 4 horas  (necesitas <= 375 activos)
    #   0 */6 * * *    -> cada 6 horas  (caben los 496 activos actuales)

    - cron: '*/30 * * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions" de GitHub

# Evita que dos ejecuciones se solapen: si una tarda mas de lo previsto y
# empieza la siguiente antes de que termine, sin esto GitHub las dejaria
# correr en paralelo - duplicando (o mas) el gasto de minutos sin avisar.
concurrency:
  group: ciclo-vigilancia
  cancel-in-progress: false

jobs:
  ejecutar-ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar un ciclo de vigilancia
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CANAL_TELEGRAM: ${{ vars.CANAL_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANAL_EMAIL: ${{ vars.CANAL_EMAIL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TV_SESSION: ${{ secrets.TV_SESSION }}
          TV_SIGNATURE: ${{ secrets.TV_SIGNATURE }}
          # INTERVALO_MINUTOS se deja vacio a proposito: en GitHub Actions el
          # ciclo debe ejecutarse UNA vez y salir; es el cron de arriba quien
          # decide la periodicidad.
        run: npm run ciclo
