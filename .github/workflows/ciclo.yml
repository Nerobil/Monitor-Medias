name: Ciclo de vigilancia - Monitor de Cruces

on:
  schedule:
    # Con las optimizaciones de la Parte 2 (menos peticiones + procesamiento
    # en paralelo), cada hora ya cabe con los 496 activos actuales dentro del
    # limite gratuito de GitHub (2000 min/mes) - antes hacian falta 6 horas.
    # Cambia SOLO esta linea segun tu criterio - opciones ya calculadas
    # (comenta/descomenta la que quieras usar; cifras estimadas, confirmalas
    # con la duracion real de tus proximos ciclos en la pestaña Actions):
    #
    #   */30 * * * *   -> cada 30 min   (necesitas <= 375 activos)
    #   0 * * * *      -> cada 1 hora   (caben los 496 activos actuales)
    #   0 */2 * * *    -> cada 2 horas  (mucho margen, hasta ~1500 activos)
    #   0 */4 * * *    -> cada 4 horas
    #   0 */6 * * *    -> cada 6 horas  (valor anterior, ya no hace falta)
    - cron: '0 * * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions" de GitHub

# Evita que dos ejecuciones se solapen: si una tarda mas de lo previsto y
# empieza la siguiente antes de que termine, sin esto GitHub las dejaria
# correr en paralelo - duplicando (o mas) el gasto de minutos sin avisar.
concurrency:
  group: ciclo-vigilancia
  cancel-in-progress: false

jobs:
  ejecutar-ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar un ciclo de vigilancia
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # El ON/OFF real de Telegram y Email ahora se controla desde la web
          # (/ajustes.html, guardado en la base de datos) - estas dos
          # variables ya NO deciden nada mientras la base de datos tenga un
          # valor guardado; solo actuan como respaldo si nunca has entrado
          # en /ajustes.html. Las credenciales de abajo SI siguen haciendo
          # falta siempre, vengan de donde vengan los interruptores.
          CANAL_TELEGRAM: ${{ vars.CANAL_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANAL_EMAIL: ${{ vars.CANAL_EMAIL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TV_SESSION: ${{ secrets.TV_SESSION }}
          TV_SIGNATURE: ${{ secrets.TV_SIGNATURE }}
          # Cuantos activos se procesan a la vez. Sube esto (Settings > Secrets
          # and variables > Actions > Variables > CONCURRENCIA_ACTIVOS) si
          # quieres ir mas rapido; bajalo si ves mas errores de conexion de
          # lo normal en el log. Por defecto 4 si no defines la variable.
          CONCURRENCIA_ACTIVOS: ${{ vars.CONCURRENCIA_ACTIVOS }}
          # INTERVALO_MINUTOS se deja vacio a proposito: en GitHub Actions el
          # ciclo debe ejecutarse UNA vez y salir; es el cron de arriba quien
          # decide la periodicidad.
        run: npm run ciclo
