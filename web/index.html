<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monitor de Cruces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --surface:#121821; --surface-2:#1A2129; --border:#232C38;
    --text:#EDF1F5; --text-2:#8B98A8; --text-3:#5C6773;
    --gold:#E3A548; --up:#35D08C; --down:#F0555A; --lateral:#6B7684;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{padding-bottom:3rem;}
  a{color:var(--gold);}

  .ticker-rail{background:var(--surface); border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap; padding:8px 0;}
  .ticker-track{display:inline-block; animation:scroll 40s linear infinite;}
  .ticker-rail:hover .ticker-track{animation-play-state:paused;}
  @keyframes scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  .ticker-item{display:inline-flex; align-items:center; gap:6px; padding:0 20px; font-family:var(--font-mono); font-size:13px; color:var(--text-2);}
  .ticker-item b{color:var(--text); font-weight:500;}
  .ticker-up{color:var(--up);} .ticker-down{color:var(--down);}
  @media (prefers-reduced-motion: reduce){ .ticker-track{animation:none;} }

  header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:20px 24px; max-width:1100px; margin:0 auto;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-family:var(--font-display); font-weight:600; font-size:20px; margin:0;}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--up); display:inline-block; margin-right:6px; box-shadow:0 0 0 3px rgba(53,208,140,0.15);}
  .status{font-size:12px; color:var(--text-3); font-family:var(--font-mono);}
  .enlace-universo{font-size:12px; color:var(--gold); text-decoration:none; font-family:var(--font-mono);}

  .barra-filtros{max-width:1100px; margin:0 auto; padding:0 24px 12px; display:flex; flex-wrap:wrap; gap:18px; align-items:center;}
  .grupo-filtro{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .grupo-filtro .lbl{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.5px; margin-right:4px;}
  .chip{
    font-family:var(--font-mono); font-size:12px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-2);
    cursor:pointer; user-select:none; transition:border-color .15s, color .15s;
  }
  .chip.on{border-color:var(--gold); color:var(--gold);}
  .chip:hover{border-color:var(--text-3);}

  main{max-width:1100px; margin:0 auto; padding:0 24px;}
  .lista{display:flex; flex-direction:column; gap:10px; margin-top:8px;}

  .fila{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; transition:opacity .2s, transform .2s;}
  .fila.saliendo{opacity:0; transform:translateX(20px);}
  .fila-principal{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .nivel-badge{font-family:var(--font-mono); font-size:11px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap;}
  .nivel-1{background:rgba(79,143,224,0.15); color:#7CB2F0;}
  .nivel-2{background:rgba(227,165,72,0.18); color:var(--gold);}
  .nivel-3{background:rgba(240,85,90,0.18); color:#F58489;}
  .fila-nombre{font-family:var(--font-display); font-weight:600; font-size:15px;}
  .fila-simbolo{font-family:var(--font-mono); font-size:12px; color:var(--text-3); font-weight:400; margin-left:6px;}
  .fila-mercado{font-size:12px; color:var(--text-3); margin-left:8px;}
  .tf-badge{font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:6px; background:var(--surface-2); color:var(--text-2); white-space:nowrap;}
  .fila-tiempo{font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-left:auto; white-space:nowrap;}
  .btn-borrar{
    background:none; border:1px solid var(--border); color:var(--text-3); border-radius:6px;
    width:26px; height:26px; cursor:pointer; font-size:14px; line-height:1; flex-shrink:0;
  }
  .btn-borrar:hover{border-color:var(--down); color:var(--down);}

  .fila-mensaje{font-size:13px; color:var(--text-2); margin-top:8px; line-height:1.5;}

  .fila-contexto{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:12px;}
  .precio{font-weight:600;}
  .delta{padding:2px 7px; border-radius:6px; font-weight:500;}
  .delta.up{color:var(--up); background:rgba(53,208,140,0.1);}
  .delta.down{color:var(--down); background:rgba(240,85,90,0.1);}
  .rsi-inline{color:var(--text-2);}
  .tendencias-inline{display:flex; gap:6px; color:var(--text-2);}
  .tendencias-inline .arrow-up{color:var(--up);} .tendencias-inline .arrow-down{color:var(--down);} .tendencias-inline .arrow-lat{color:var(--lateral);}

  .empty{text-align:center; padding:80px 20px; color:var(--text-3);}
  .empty h2{font-family:var(--font-display); color:var(--text-2); font-weight:600; font-size:18px;}

  footer{max-width:1100px; margin:32px auto 0; padding:0 24px; color:var(--text-3); font-size:12px;}

  @media (max-width:600px){
    header{padding:16px;} main{padding:0 16px;} .barra-filtros{padding:0 16px 12px;}
    .fila-tiempo{margin-left:0; width:100%; order:10;}
  }
</style>
</head>
<body>

<div class="ticker-rail"><div class="ticker-track" id="tickerTrack"></div></div>

<header>
  <div class="brand"><h1><span class="dot"></span>Monitor de Cruces</h1></div>
  <div class="status" id="statusTxt">cargando...</div>
  <a class="enlace-universo" href="/universo.html">+ gestionar activos</a>
</header>

<div class="barra-filtros">
  <div class="grupo-filtro">
    <span class="lbl">Timeframe</span>
    <div id="filtroTf"></div>
  </div>
  <div class="grupo-filtro">
    <span class="lbl">Panel</span>
    <div id="togglesVarios"></div>
  </div>
</div>

<main>
  <div class="lista" id="lista"></div>
  <div class="empty" id="empty" style="display:none;">
    <h2>Sin alertas activas</h2>
    <p>No hay cruces detectados en las últimas 36 horas para este filtro.</p>
  </div>
</main>

<footer>Datos vía TradingView · el histórico completo queda en Historico_Alertas.</footer>

<script>
const TF_LABELS = {15:'15m', 30:'30m', 60:'1h', 240:'4h', '1D':'1D'};

const DEMO_DATA = {
  mostrarRsi: true,
  timeframes: [
    {timeframe:'15', etiqueta:'15m'}, {timeframe:'30', etiqueta:'30m'}, {timeframe:'60', etiqueta:'1h'},
    {timeframe:'240', etiqueta:'4h'}, {timeframe:'1D', etiqueta:'1D'},
  ],
  alertas: [
    {
      id:'demo1', nombre_activo:'Inditex', tv_symbol:'BME:ITX', mercado:'BME (Madrid)', timeframe:'60',
      media_rapida:'EMA 9', media_lenta:'EMA 21', direccion:'ALCISTA', nivel:2,
      mensaje:'EMA 9 ha cruzado EMA 21 al alza en 1 hora. Nivel 2. Precio: 38.42. ' + new Date().toLocaleString('es-ES'),
      precio_actual:38.42, var_dia:0.84, rsi:58, tendencias:{15:'ALCISTA',30:'ALCISTA',60:'ALCISTA',240:'LATERAL','1D':'ALCISTA'},
      detectada_en: hace(0,14),
    },
    {
      id:'demo2', nombre_activo:'Bitcoin', tv_symbol:'COINBASE:BTCUSD', mercado:'Exchange Cripto', timeframe:'240',
      media_rapida:'SMA 50', media_lenta:'SMA 200', direccion:'BAJISTA', nivel:3,
      mensaje:'SMA 50 ha cruzado SMA 200 a la baja en 4 horas. Nivel 3. Precio: 68420. ' + new Date().toLocaleString('es-ES'),
      precio_actual:68420, var_dia:-1.42, rsi:31, tendencias:{15:'BAJISTA',30:'BAJISTA',60:'BAJISTA',240:'BAJISTA','1D':'LATERAL'},
      detectada_en: hace(8,3),
    },
  ],
};
function hace(h,m){ const d=new Date(); d.setHours(d.getHours()-h, d.getMinutes()-m); return d.toISOString(); }

function fmtPct(v){ if(v===null||v===undefined) return '—'; const s=v>=0?'+':''; return s+v.toFixed(2)+'%'; }
function tiempoRelativo(iso){
  const diffMs = Date.now() - new Date(iso.endsWith('Z')?iso:iso+'Z').getTime();
  const h = Math.floor(diffMs/3600000), m = Math.floor((diffMs%3600000)/60000);
  if(h<1) return `hace ${Math.max(m,0)} min`;
  return `hace ${h}h ${m}min`;
}
function flechaTendencia(t){
  if(t==='ALCISTA') return '<span class="arrow-up">▲</span>';
  if(t==='BAJISTA') return '<span class="arrow-down">▼</span>';
  return '<span class="arrow-lat">●</span>';
}

let tfFiltro = null;
let rsiVisible = true;
let tendenciasVisible = true;

function renderFiltrosTf(timeframes){
  const cont = document.getElementById('filtroTf');
  cont.innerHTML = '';
  const chipTodos = document.createElement('div');
  chipTodos.className = 'chip' + (tfFiltro===null?' on':'');
  chipTodos.textContent = 'Todos';
  chipTodos.onclick = () => { tfFiltro = null; cargar(); };
  cont.appendChild(chipTodos);
  timeframes.forEach(tf=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (tfFiltro===String(tf.timeframe)?' on':'');
    chip.textContent = TF_LABELS[tf.timeframe] || tf.etiqueta;
    chip.onclick = () => { tfFiltro = String(tf.timeframe); cargar(); };
    cont.appendChild(chip);
  });
}

function renderTogglesVarios(mostrarRsi){
  rsiVisible = mostrarRsi;
  const cont = document.getElementById('togglesVarios');
  cont.innerHTML = '';
  const chipRsi = document.createElement('div');
  chipRsi.className = 'chip' + (rsiVisible?' on':'');
  chipRsi.textContent = 'RSI';
  chipRsi.onclick = () => { rsiVisible = !rsiVisible; chipRsi.classList.toggle('on'); render(window.__ultimoPanel); };
  cont.appendChild(chipRsi);
  const chipTend = document.createElement('div');
  chipTend.className = 'chip' + (tendenciasVisible?' on':'');
  chipTend.textContent = 'Tendencias';
  chipTend.onclick = () => { tendenciasVisible = !tendenciasVisible; chipTend.classList.toggle('on'); render(window.__ultimoPanel); };
  cont.appendChild(chipTend);
}

function renderTicker(alertas){
  const track = document.getElementById('tickerTrack');
  if(!alertas.length){ track.innerHTML = '<span class="ticker-item">Sin alertas activas</span>'; return; }
  const items = alertas.slice(0,30).map(a=>{
    const cls = a.direccion==='ALCISTA' ? 'ticker-up' : a.direccion==='BAJISTA' ? 'ticker-down' : '';
    const flecha = a.direccion==='ALCISTA' ? '▲' : a.direccion==='BAJISTA' ? '▼' : '●';
    return `<span class="ticker-item"><b>${a.nombre_activo}</b> <span class="${cls}">${flecha} ${a.media_rapida}/${a.media_lenta} ${TF_LABELS[a.timeframe]||a.timeframe}</span></span>`;
  }).join('');
  track.innerHTML = items + items;
}

async function borrarAlerta(id, elFila){
  elFila.classList.add('saliendo');
  try{
    const resp = await fetch(`/api/alertas/${encodeURIComponent(id)}`, { method:'DELETE' });
    if(!resp.ok) throw new Error('No se pudo borrar');
    setTimeout(()=>{
      window.__ultimoPanel.alertas = window.__ultimoPanel.alertas.filter(a=>a.id!==id);
      render(window.__ultimoPanel);
    }, 200);
  }catch(err){
    elFila.classList.remove('saliendo');
    alert('No se pudo borrar la alerta: ' + err.message);
  }
}

function render(panel){
  window.__ultimoPanel = panel;
  const lista = document.getElementById('lista');
  const empty = document.getElementById('empty');
  document.getElementById('statusTxt').textContent = `en vivo · ${panel.alertas.length} alerta(s)${tfFiltro?` · ${TF_LABELS[tfFiltro]||tfFiltro}`:''}`;
  renderTicker(panel.alertas);

  if(!panel.alertas.length){ lista.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  lista.innerHTML = panel.alertas.map(a=>{
    const tendencias = a.tendencias || {};
    const tendHtml = tendenciasVisible && Object.keys(tendencias).length
      ? `<span class="tendencias-inline">${Object.keys(tendencias).map(tf=>`${TF_LABELS[tf]||tf}${flechaTendencia(tendencias[tf])}`).join(' ')}</span>`
      : '';
    const rsiHtml = rsiVisible && a.rsi!==null && a.rsi!==undefined
      ? `<span class="rsi-inline">RSI ${Math.round(a.rsi)}</span>` : '';
    const precioHtml = a.precio_actual!=null
      ? `<span class="precio">${a.precio_actual.toLocaleString('es-ES',{maximumFractionDigits:2})}</span> <span class="delta ${a.var_dia>=0?'up':'down'}">${fmtPct(a.var_dia)} hoy</span>`
      : '';

    return `
    <div class="fila" data-id="${a.id}">
      <div class="fila-principal">
        <span class="nivel-badge nivel-${a.nivel||1}">Nivel ${a.nivel??'—'}</span>
        <span class="fila-nombre">${a.nombre_activo}<span class="fila-simbolo">${a.tv_symbol||''}</span></span>
        <span class="fila-mercado">${a.mercado||''}</span>
        <span class="tf-badge">${TF_LABELS[a.timeframe]||a.timeframe}</span>
        <span class="fila-tiempo">${tiempoRelativo(a.detectada_en)}</span>
        <button class="btn-borrar" title="Descartar esta alerta">✕</button>
      </div>
      <div class="fila-mensaje">${a.mensaje}</div>
      ${(precioHtml || rsiHtml || tendHtml) ? `<div class="fila-contexto">${precioHtml}${rsiHtml}${tendHtml}</div>` : ''}
    </div>`;
  }).join('');

  lista.querySelectorAll('.btn-borrar').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const fila = ev.target.closest('.fila');
      borrarAlerta(fila.dataset.id, fila);
    });
  });
}

async function cargar(){
  try{
    const qs = tfFiltro ? `?timeframe=${encodeURIComponent(tfFiltro)}` : '';
    const resp = await fetch('/api/panel' + qs);
    if(!resp.ok) throw new Error('sin servidor');
    const data = await resp.json();
    renderFiltrosTf(data.timeframes || []);
    renderTogglesVarios(data.mostrarRsi !== false);
    render(data);
  }catch(err){
    document.getElementById('statusTxt').textContent = 'vista previa (datos de ejemplo)';
    renderFiltrosTf(DEMO_DATA.timeframes);
    renderTogglesVarios(DEMO_DATA.mostrarRsi);
    render(DEMO_DATA);
  }
}
cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
